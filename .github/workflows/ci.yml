name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  edge-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check --config supabase/functions/deno.json supabase/functions
      - run: deno test --config supabase/functions/deno.json supabase/functions/_shared/meal-schema.test.ts
      - run: deno check --config supabase/functions/deno.json supabase/functions/analyze-meal/index.ts
      - run: deno check --config supabase/functions/deno.json supabase/functions/send-reminders/index.ts
